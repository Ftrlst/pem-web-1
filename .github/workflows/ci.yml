name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://kletak:kletak@localhost:5432/kletak_test?schema=public
  TEST_DATABASE_URL: postgresql://kletak:kletak@localhost:5432/kletak_test?schema=public
  JWT_ACCESS_SECRET: ci-only-access-secret-please-change-32
  JWT_REFRESH_SECRET: ci-only-refresh-secret-please-change-32
  NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: kletak_test
          POSTGRES_USER: kletak
          POSTGRES_PASSWORD: kletak
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kletak -d kletak_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: |
          set -o pipefail
          pnpm install --frozen-lockfile 2>&1 | tee install.log || {
            echo "::error title=pnpm install failed::$(tail -n 12 install.log | tr '\n' '%0A')"
            exit 1
          }
      - name: Generate Prisma client
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
        run: |
          set -o pipefail
          pnpm db:generate 2>&1 | tee step-generate.log
      - name: Validate Prisma schema
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
        run: |
          set -o pipefail
          pnpm db:validate 2>&1 | tee step-validate.log
      - name: Apply database migrations
        run: |
          set -o pipefail
          pnpm db:migrate:deploy 2>&1 | tee step-migrate.log
      - name: Typecheck
        run: |
          set -o pipefail
          pnpm typecheck 2>&1 | tee step-typecheck.log
      - name: Unit tests
        run: |
          set -o pipefail
          pnpm test 2>&1 | tee step-unit.log
      - name: PostgreSQL integration tests
        run: |
          set -o pipefail
          pnpm test:integration 2>&1 | tee step-integration.log
      - name: Build
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          JWT_ACCESS_SECRET: ci-only-access-secret-please-change-32
          JWT_REFRESH_SECRET: ci-only-refresh-secret-please-change-32
          NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
        run: |
          set -o pipefail
          pnpm build 2>&1 | tee step-build.log
      - name: Surface failure diagnostics
        if: failure()
        run: |
          shopt -s nullglob
          for f in step-*.log; do
            echo "::error title=${f%.log}::$(tail -n 12 "$f" | tr '\n' '%0A')"
          done

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/api.Dockerfile
          push: false
          tags: kletak-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/web.Dockerfile
          push: false
          tags: kletak-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
