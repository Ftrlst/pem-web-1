apiVersion: apps/v1
kind: Deployment
metadata:
  name: kletak-web
  namespace: kletak
  labels:
    app: kletak-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kletak-web
  template:
    metadata:
      labels:
        app: kletak-web
    spec:
      containers:
        - name: web
          image: ghcr.io/OWNER/kletak-web:VERSION
          ports:
            - containerPort: 3000
          env:
            - name: NEXT_PUBLIC_API_URL
              value: /api/v1
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: kletak-web
  namespace: kletak
spec:
  selector:
    app: kletak-web
  ports:
    - name: http
      port: 80
      targetPort: 3000
