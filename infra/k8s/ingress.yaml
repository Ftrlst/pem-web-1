apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kletak-ingress
  namespace: kletak
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: '10m'
    nginx.ingress.kubernetes.io/proxy-read-timeout: '60'
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - app.example.com
      secretName: kletak-tls
  rules:
    - host: app.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: kletak-api
                port:
                  number: 4000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kletak-web
                port:
                  number: 80
