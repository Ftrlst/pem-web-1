apiVersion: v1
kind: Secret
metadata:
  name: kletak-secrets
  namespace: kletak
type: Opaque
stringData:
  DATABASE_URL: mysql://kletak:replace-me@mysql:3306/kletak
  JWT_ACCESS_SECRET: replace-with-32-plus-random-characters
  JWT_REFRESH_SECRET: replace-with-a-different-random-secret
  MIDTRANS_SERVER_KEY: ''
  MIDTRANS_CLIENT_KEY: ''
  MIDTRANS_WEBHOOK_SECRET: ''
  XENDIT_SECRET_KEY: ''
  XENDIT_WEBHOOK_SECRET: ''
